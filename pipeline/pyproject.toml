[project]
name = "vault-pipeline"
version = "0.1.0"
description = "Local-first YouTube podcast knowledge extraction pipeline"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "yt-dlp>=2024.0.0",
    "librosa>=0.10.0",
    "httpx>=0.27.0",
    "soundfile>=0.12.0",
]

[project.optional-dependencies]
diarize-whisper = [
    "faster-whisper>=1.0.0",
    "ctc-forced-aligner>=0.3.0",
    "nemo-toolkit[asr]>=2.0.0",
    "demucs>=4.0.0",
]
diarize-pyannote = [
    "pyannote.audio>=3.1.0",
    "faster-whisper>=1.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
agents = [
    "python-Levenshtein>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build]
dev-mode-dirs = [".."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require network access (deselect with '-m not integration')",
]
